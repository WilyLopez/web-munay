<!doctype html>
<html lang="es">
  <body style="background:#f8f4ea;color:#193b33;font-family:Arial,sans-serif;padding:24px">
    <div style="background:#fff;border-radius:16px;margin:auto;max-width:480px;padding:24px">
      <p style="font-weight:bold">Munay</p>
      <h1>Confirma tu correo</h1>
      <p>Abre el enlace y confirma tu correo en Munay para activar tu cuenta.</p>
      <p><a style="background:#174238;border-radius:8px;color:#fff;display:inline-block;padding:12px 16px" href="{{ .SiteURL }}/autenticacion/confirmar?token_hash={{ .TokenHash }}">Abrir confirmación</a></p>
      <p>Si no solicitaste una cuenta en Munay, puedes ignorar este mensaje.</p>
    </div>
  </body>
</html>
